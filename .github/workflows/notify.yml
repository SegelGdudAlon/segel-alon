name: Segel Alon due-date notifications

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Test: staff email to send a test notification to (empty = normal run)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: notify
        run: npm install --no-audit --no-fund
      - name: Send notifications
        working-directory: notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: node send.mjs
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            date -u > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive && git commit -m "keepalive" && git push
          fi
