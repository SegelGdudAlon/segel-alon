const fmtWhen = ms => { try { const d = new Date(ms); return `${d.getDate()}.${d.getMonth() + 1} ${pad(d.getHours())}:${pad(d.getMinutes())}`; } catch { return ''; } };

function invItemModal(co, item, isNew){
  const r = item ? invRow(co, item) : null;
  const creating = !r;
  const name = inp(r ? r.item : (item || ''), 'שם הציוד, לדוגמה: אלונקות', { list:'inv-names', maxlength:40 });
  const dl = h('datalist',{id:'inv-names'}, invAllNames().map(n => h('option',{value:n})));
  const cats = invCats();
  const curCat = item ? invCatOf(item) : '';
  const cat = sel([{ value:'', label:'בחירת קטגוריה…' }, ...cats.map(c => ({ value:c, label:c }))], cats.includes(curCat) ? curCat : '');
  const ok = inp(String(r ? r.ok : 0), '', { type:'number', min:0, max:100000, inputmode:'numeric' });
  const bad = inp(String(r ? r.bad : 0), '', { type:'number', min:0, max:100000, inputmode:'numeric' });
  const hint = h('div',{class:'hint'});
  const checkName = () => {
    const v = name.value.trim(); hint.replaceChildren();
    if(!v) return;
    const same = invAllNames().find(n => invKey(n) === invKey(v));
    if(same){ if(!cat.value){ const c = invCatOf(same); if(cats.includes(c)) cat.value = c; } if(creating && invRow(co, same)) hint.append('לפלוגה כבר יש את הפריט הזה — השמירה תעדכן את הכמויות.'); return; }
    const sim = invAllNames().filter(n => invSimilar(n, v)).slice(0, 3);
    if(sim.length) hint.append('כבר קיים ציוד בשם דומה: ', ...sim.map(n => h('button',{type:'button',class:'tagchip',style:{margin:'0 4px'},onclick:()=>{ name.value = n; checkName(); }}, n)));
  };
  name.addEventListener('input', checkName); checkName();
  const save = h('button',{class:'btn primary'}, 'שמירה');
  const del = !creating ? h('button',{class:'btn ghost danger', style:{marginInlineStart:'auto'}}, icon('trash',15), 'מחיקה') : null;
  const close = openModal({ title: (creating ? 'הוספת ציוד' : 'עריכת ציוד') + ` · פלוגה ${co}`,
    body: h('div',{class:'form'}, field('שם הציוד', h('div',null, name, dl), null), hint,
      field('קטגוריה', cat, 'הקטגוריה משותפת לכל הגדוד — שינוי שלה משנה את הפריט בכל הפלוגות.'),
      h('div',{style:{display:'flex',gap:'12px'}}, h('div',{style:{flex:1}}, field('תקין', ok)), h('div',{style:{flex:1}}, field('תקול', bad)))),
    footer: [save, h('button',{class:'btn ghost', onclick:()=>close()}, 'ביטול'), del] });
  setTimeout(() => (creating ? name : ok).focus(), 50);
  save.addEventListener('click', async () => {
    const nm = name.value.trim();
    if(!nm) return toast('נא למלא שם ציוד','err');
    if(nm.length > 40) return toast('שם עד 40 תווים','err');
    if(!cat.value) return toast('נא לבחור קטגוריה','err');
    const o = +ok.value, b = +bad.value;
    if(!(o >= 0 && b >= 0 && o <= 100000 && b <= 100000)) return toast('כמויות לא תקינות','err');
    save.disabled = true;
    try {
      if(r && invKey(r.item) !== invKey(nm)){ await S.db.doc('invStock/' + invDocId(co, r.item)).delete(); }
      const finalName = await invSaveRow(co, nm, o, b);
      await invSetCat(finalName, cat.value);
      invLog('עדכון מלאי', co, finalName, `תקין ${Math.round(o)}, תקול ${Math.round(b)}, ${cat.value}`);
      toast('נשמר'); close();
    } catch(e){ toast(errMsg(e), 'err'); save.disabled = false; }
  });
  if(del) del.addEventListener('click', async () => {
    if(!(await confirmDialog('מחיקת ציוד', `למחוק את "${r.item}" מהמלאי של פלוגה ${co}?`, 'מחיקה', true))) return;
    if(await act(S.db.doc('invStock/' + invDocId(co, r.item)).delete(), 'נמחק')){ invLog('מחיקת ציוד', co, r.item, ''); close(); }
  });
}

function invTransferModal(defCo){
  const mineList = invEditableComps();
  const comps = invComps();
  const st = { me: defCo && mineList.includes(defCo) ? defCo : mineList[0], dir: 'send', other: '', item: '', qty: 1, note: '' };
  const body = h('div',{class:'form'});
  const save = h('button',{class:'btn primary'}, 'שליחת בקשה');
  const draw = () => {
    const others = comps.filter(c => c !== st.me);
    if(!others.includes(st.other)) st.other = others[0] || '';
    const giver = st.dir === 'send' ? st.me : st.other;
    const avail = invStock().filter(r => r.company === giver && (+r.ok || 0) > 0).sort((a, b) => a.item.localeCompare(b.item, 'he'));
    if(!avail.some(r => r.item === st.item)) st.item = avail[0] ? avail[0].item : '';
    const max = (avail.find(r => r.item === st.item) || {}).ok || 0;
    body.replaceChildren(
      mineList.length > 1 ? field('הפלוגה שלי', sel(mineList.map(c => ({ value:c, label:'פלוגה ' + c })), st.me, { onchange:e => { st.me = e.target.value; draw(); } })) : h('div',{class:'small muted'}, `בשם פלוגה ${st.me}`),
      field('מה עושים', segmented([{ id:'send', label:'אני שולח ציוד' }, { id:'ask', label:'אני מבקש ציוד' }], st.dir, v => { st.dir = v; draw(); })),
      field(st.dir === 'send' ? 'לאיזו פלוגה' : 'מאיזו פלוגה', sel(others.map(c => ({ value:c, label:'פלוגה ' + c })), st.other, { onchange:e => { st.other = e.target.value; draw(); } })),
      avail.length ? field('ציוד', sel(avail.map(r => ({ value:r.item, label:`${r.item} (זמין: ${r.ok})` })), st.item, { onchange:e => { st.item = e.target.value; draw(); } }), `מוצג רק ציוד תקין שיש לפלוגה ${giver}.`)
        : h('div',{class:'notice'}, `לפלוגה ${giver} אין ציוד תקין במלאי.`),
      avail.length ? field('כמות', inp(String(st.qty), '', { type:'number', min:1, max, oninput:e => { st.qty = +e.target.value; } }), `עד ${max}`) : null,
      field('הערה (לא חובה)', inp(st.note, '', { maxlength:200, oninput:e => { st.note = e.target.value; } })),
      h('div',{class:'xs muted'}, 'הבקשה תעבור לאישור הפלוגה השנייה. הציוד יעבור רק אחרי האישור. ציוד תקול לא עובר בהעברה.'));
    save.disabled = !avail.length;
  };
  draw();
  const close = openModal({ title:'בקשת העברת ציוד', body, footer:[save, h('button',{class:'btn ghost', onclick:()=>close()}, 'ביטול')] });
  save.addEventListener('click', async () => {
    const from = st.dir === 'send' ? st.me : st.other, to = st.dir === 'send' ? st.other : st.me;
    const r = invRow(from, st.item); const q = Math.round(+st.qty || 0);
    if(!st.item || !r) return toast('נא לבחור ציוד','err');
    if(q < 1) return toast('כמות לא תקינה','err');
    if(q > (+r.ok || 0)) return toast(`לפלוגה ${from} יש רק ${r.ok} תקין`,'err');
    const id = 'R' + Date.now() + Math.floor(Math.random() * 1000);
    save.disabled = true;
    if(await act(S.db.doc('invReq/' + id).set({ at: Date.now(), from, to, item: r.item, qty: q, createdBy: st.me, note: st.note.trim().slice(0, 200), status: 'pending', by: S.me.id }), 'הבקשה נשלחה')){
      invLog('בקשת העברה', st.me, r.item, `${q} מפלוגה ${from} לפלוגה ${to}`); close();
    } else save.disabled = false;
  });
}
async function invDecide(r, approve){
  if(approve){
    const g = invRow(r.from, r.item);
    if(!g || (+g.ok || 0) < r.qty) return toast(`לפלוגה ${r.from} אין מספיק ${r.item} תקין (יש ${g ? g.ok : 0})`, 'err');
    if(!(await confirmDialog('אישור העברה', `להעביר ${r.qty} × ${r.item} מפלוגה ${r.from} לפלוגה ${r.to}?`, 'אישור'))) return;
    try {
      const t = invRow(r.to, r.item);
      await invSaveRow(r.from, g.item, (+g.ok || 0) - r.qty, g.bad);
      await invSaveRow(r.to, g.item, (t ? +t.ok || 0 : 0) + r.qty, t ? t.bad : 0);
      await S.db.doc('invReq/' + r.id).set(Object.assign(stripId(r), { status: 'approved', decidedAt: Date.now(), decidedBy: S.me.id }));
      invLog('אישור העברה', r.to, r.item, `${r.qty} מפלוגה ${r.from} לפלוגה ${r.to}`);
      toast('ההעברה בוצעה ✓');
    } catch(e){ toast(errMsg(e), 'err'); }
  } else {
    const reason = inp('', 'סיבה (לא חובה)', { maxlength:200 });
    const ok = h('button',{class:'btn danger'}, 'דחייה');
    const close = openModal({ title:'דחיית בקשה', body:h('div',{class:'form'}, h('div',null, `${r.qty} × ${r.item} · מפלוגה ${r.from} לפלוגה ${r.to}`), field('סיבה', reason)), footer:[ok, h('button',{class:'btn ghost', onclick:()=>close()}, 'ביטול')] });
    ok.addEventListener('click', async () => {
      if(await act(S.db.doc('invReq/' + r.id).set(Object.assign(stripId(r), { status: 'rejected', decidedAt: Date.now(), decidedBy: S.me.id, reason: reason.value.trim().slice(0, 200) })), 'הבקשה נדחתה')){
        invLog('דחיית העברה', r.from === r.createdBy ? r.to : r.from, r.item, `${r.qty} מפלוגה ${r.from} לפלוגה ${r.to}`); close(); }
    });
  }
}
async function invCancel(r){
  if(!(await confirmDialog('ביטול בקשה', `לבטל את הבקשה (${r.qty} × ${r.item})?`, 'ביטול הבקשה', true))) return;
  if(await act(S.db.doc('invReq/' + r.id).set(Object.assign(stripId(r), { status: 'cancelled', decidedAt: Date.now(), decidedBy: S.me.id })), 'הבקשה בוטלה'))
    invLog('ביטול בקשה', r.createdBy, r.item, `${r.qty} מפלוגה ${r.from} לפלוגה ${r.to}`);
}
async function invLogModal(){
  const body = h('div',null, h('p',{class:'muted'}, 'טוען…'));
  const close = openModal({ title:'יומן פעולות — רס״פיות', body, wide:true, footer:[h('button',{class:'btn ghost', onclick:()=>close()}, 'סגירה')] });
  try {
    const q = await S.db.collection('invLog').get();
    const all = q.docs.filter(d => d.exists).map(d => d.data()).sort((a, b) => (b.at || 0) - (a.at || 0));
    const st = { co: '', q: '' };
    const draw = () => {
      const list = all.filter(x => (!st.co || x.company === st.co) && (!st.q || (x.item + ' ' + x.details + ' ' + x.action).includes(st.q))).slice(0, 300);
      body.replaceChildren(
        h('div',{class:'toolbar',style:{padding:'0 0 10px'}}, inp(st.q, 'חיפוש…', { class:'input grow', oninput:e => { st.q = e.target.value; draw(); } }),
          sel([{ value:'', label:'כל הפלוגות' }, ...invComps().map(c => ({ value:c, label:'פלוגה ' + c }))], st.co, { onchange:e => { st.co = e.target.value; draw(); } }),
          h('span',{class:'small muted'}, `${list.length}${list.length === 300 ? '+' : ''} רשומות`)),
        list.length ? h('div',{class:'tbl-wrap',style:{maxHeight:'60vh'}}, h('table',{class:'tbl'},
          h('thead',null, h('tr',null, ['זמן','פעולה','פלוגה','ציוד','פרטים','ע״י'].map(x => h('th',null,x)))),
          h('tbody',null, list.map(x => h('tr',null, h('td',{class:'xs',style:{whiteSpace:'nowrap'}}, fmtWhen(x.at)), h('td',null, x.action), h('td',null, x.company), h('td',null, x.item), h('td',{class:'small'}, x.details), h('td',{class:'xs muted'}, x.by && S.members[x.by] ? nameOf(x.by) : (x.by === 'import' ? 'האתר הקודם' : ''))))))) : empty('אין רשומות','clock'));
    };
    draw();
  } catch(e){ body.replaceChildren(h('div',{class:'notice'}, 'לא ניתן לטעון את היומן: ' + errMsg(e))); }
}
async function invExportCsv(){
  const comps = invComps(), rows = invStock();
  const by = new Map(); rows.forEach(r => { const k = invKey(r.item); if(!by.has(k)) by.set(k, { item: r.item, per: {} }); by.get(k).per[r.company] = r; });
  const list = [...by.values()].sort((a, b) => invCatOf(a.item).localeCompare(invCatOf(b.item), 'he') || a.item.localeCompare(b.item, 'he'));
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const head = ['קטגוריה','ציוד', ...comps.flatMap(c => [`${c} תקין`, `${c} תקול`]), 'סה״כ תקין', 'סה״כ תקול', 'סה״כ'];
  const lines = list.map(x => { let o = 0, b = 0; const cells = comps.flatMap(c => { const r = x.per[c]; o += r ? +r.ok || 0 : 0; b += r ? +r.bad || 0 : 0; return [r ? r.ok : 0, r ? r.bad : 0]; });
    return [invCatOf(x.item), x.item, ...cells, o, b, o + b]; });
  const csv = '﻿' + [head, ...lines].map(l => l.map(q).join(',')).join('\r\n');
  try { await S.downloads.save({ filename: `דוח מלאי רס״פיות ${dstr(new Date())}.csv`, data: csv }); invLog('ייצוא דוח', '', '', `${list.length} פריטים`); }
  catch(e){ if(e && e.code !== 'declined') toast('לא ניתן להוריד את הקובץ','err'); }
}
function invCatsModal(){
  const list = invCats();
  const body = h('div',{class:'form'});
  const draw = () => body.replaceChildren(
    h('div',{class:'xs muted'}, 'רשימת הקטגוריות משותפת לכל הגדוד. שינוי שם מעביר את כל הפריטים לשם החדש.'),
    ...list.map((c, i) => h('div',{style:{display:'flex',gap:'6px',alignItems:'center'}},
      inp(c, '', { 'data-i': i, oninput:e => { list[i] = e.target.value; } }),
      h('button',{class:'icon-btn danger', type:'button', title:'הסרה', onclick:()=>{ list.splice(i, 1); draw(); }}, icon('trash',15)))),
    h('button',{class:'btn ghost sm', type:'button', onclick:()=>{ list.push(''); draw(); }}, icon('plus',14), 'קטגוריה חדשה'));
  draw();
  const save = h('button',{class:'btn primary'}, 'שמירה');
  const close = openModal({ title:'קטגוריות ציוד', body, footer:[save, h('button',{class:'btn ghost', onclick:()=>close()}, 'ביטול')] });
  save.addEventListener('click', async () => {
    const old = invCats(); const clean = list.map(x => x.trim());
    const map = Object.assign({}, (S.invMeta && S.invMeta.map) || {});
    old.forEach((c, i) => { const n = clean[i]; if(n && n !== c && !list.includes(c)) Object.keys(map).forEach(k => { if(map[k] === c) map[k] = n; }); });
    const fin = [...new Set(clean.filter(Boolean))];
    if(await act(S.db.doc('invMeta/cats').set(Object.assign({}, S.invMeta || {}, { list: fin, map })), 'הקטגוריות נשמרו')) close();
  });
}
function invImport(){
  const file = h('input',{type:'file', accept:'.json,application/json', style:{display:'none'}});
  document.body.append(file);
  file.addEventListener('change', async () => {
    const f = file.files[0]; file.remove(); if(!f) return;
    let d; try { d = JSON.parse(await f.text()); } catch(_){ return toast('הקובץ לא תקין. צריך לבחור את data.json מתוך הייצוא של האתר הקודם.','err'); }
    if(!d || !Array.isArray(d.stock)) return toast('לא נמצאו נתוני מלאי בקובץ (מצופה data.json מהייצוא).','err');
    const ours = companies(); const ourKey = Object.fromEntries(ours.map(c => [invCoKey(c), c]));
    const coMap = c => ourKey[invCoKey(c)] || invCoKey(c);
    const unknown = [...new Set(d.stock.map(r => coMap(r.company)).filter(c => !ours.includes(c)))];
    const ok = await confirmDialog('ייבוא מהאתר הקודם', h('div',null,
      h('p',null, `נמצאו ${d.stock.length} שורות מלאי, ${(d.requests || []).length} בקשות העברה ו-${(d.log || []).length} רשומות יומן.`),
      h('p',null, 'ייבוא חוזר דורס את הכמויות שבאתר בכמויות מהקובץ. כדאי לייבא פעם אחת, ממש לפני שעוברים לעבוד רק כאן.'),
      unknown.length ? h('div',{class:'notice'}, `פלוגות שלא מוגדרות באתר: ${unknown.join(', ')}. הן ייובאו ויוצגו, ומומלץ להוסיף אותן בהגדרות.`) : null), 'ייבוא');
    if(!ok) return;
    toast('מייבא… זה לוקח כחצי דקה');
    try {
      const pool = async (items, fn, n = 12) => { let i = 0; await Promise.all(Array.from({ length: n }, async () => { while(i < items.length){ const x = items[i++]; await fn(x); } })); };
      const map = Object.assign({}, (S.invMeta && S.invMeta.map) || {});
      (d.categories_sheet || []).forEach(x => { if(x.item && x.category) map[invKey(x.item)] = x.category; });
      d.stock.forEach(r => { if(r.item && r.category && r.category !== INV_NOCAT) map[invKey(r.item)] = r.category; });
      const list = [...new Set([...((d.constants && d.constants.categories) || INV_DEFAULT_CATS), ...invCats()])];
      await S.db.doc('invMeta/cats').set({ list, map, importedAt: Date.now() });
      const ts = s => { const t = Date.parse(s); return isNaN(t) ? Date.now() : t; };
      await pool(d.stock, r => S.db.doc('invStock/' + invDocId(coMap(r.company), r.item)).set({ company: coMap(r.company), item: invKey(r.item), ok: +r.ok || 0, bad: +r.bad || 0, updatedAt: ts(r.updated_at), by: 'import' }));
      const stMap = { 'ממתין':'pending', 'אושר':'approved', 'נדחה':'rejected', 'בוטל':'cancelled' };
      await pool(d.requests || [], r => S.db.doc('invReq/' + r.id).set({ at: ts(r.created_at), from: coMap(r.from_company), to: coMap(r.to_company), item: invKey(r.item), qty: +r.qty || 0,
        createdBy: coMap(r.created_by), note: r.note || '', status: stMap[r.status] || 'cancelled', decidedAt: r.decided_at ? ts(r.decided_at) : null, reason: r.reject_reason || '', by: 'import' }));
      await pool(d.log || [], x => S.db.doc('invLog/i_' + invHash(x.at + x.action + x.company + x.item + x.details)).set({ at: ts(x.at), action: x.action, company: x.company ? coMap(x.company) : '', item: x.item || '', details: x.details || '', by: 'import' }));
      invLog('ייבוא מהאתר הקודם', '', '', `${d.stock.length} שורות מלאי`);
      toast(`הייבוא הסתיים ✓ (${d.stock.length} שורות מלאי)`);
    } catch(e){ console.error(e); toast('הייבוא נעצר: ' + errMsg(e) + '. אפשר להריץ שוב.', 'err'); }
  });
  file.click();
}

/* ---------- phone book ---------- */
const PB_COLS = [
  { k:'name', label:'שם מלא' }, { k:'position', label:'תפקיד' }, { k:'company', label:'פלוגה' },
  { k:'phone', label:'טלפון', ltr:true }, { k:'email', label:'מייל', ltr:true }, { k:'personalNumber', label:'מספר אישי', ltr:true }, { k:'mastab', label:'מסט״ב', ltr:true },
];
function phonebookView(){
  const f = UI.pb;
  let list = allMembers().map(m => Object.assign({}, m, { name:nameOf(m.id) }));
  if(f.company) list = list.filter(m => (m.company||'')===f.company);
  if(f.q) list = list.filter(m => PB_COLS.some(c => String(m[c.k]||'').includes(f.q)));
  const exportCsv = async () => {
    const q = v => '"' + String(v||'').replace(/"/g,'""') + '"';
    const csv = '﻿' + [PB_COLS.map(c=>q(c.label)).join(','), ...list.map(m => PB_COLS.map(c=>q(m[c.k])).join(','))].join('\r\n');
    try { await S.downloads.save({ filename:'ספר טלפונים - סגל אלון.csv', data:csv }); }
    catch(e){ if(e && e.code!=='declined') toast('לא ניתן להוריד את הקובץ מהתצוגה הזו','err'); }
  };
  const missing = m => !m.phone || !m.personalNumber || !m.mastab;
  const meMissing = meM() && missing(Object.assign({}, meM()));
  return h('div',null,
    pageHead('ספר טלפונים','הפרטים נשאבים אוטומטית מהפרטים האישיים של כל איש סגל.',
      [ h('button',{class:'btn primary',onclick:()=>memberModal(S.me.id)}, icon('user',16),'עדכון הפרטים שלי'),
        S.downloads && list.length ? h('button',{class:'btn ghost',onclick:exportCsv}, icon('dl',16),'ייצוא לאקסל') : null ]),
    meMissing ? h('div',{class:'banner warn'}, icon('user'), h('div',null,'חסרים פרטים בכרטיס שלך (טלפון / מספר אישי / מסט״ב). ', h('button',{class:'linkish',onclick:()=>memberModal(S.me.id)},'השלמת פרטים'))) : null,
    h('div',{class:'card'},
      h('div',{class:'toolbar'},
        inp(f.q,'חיפוש שם, טלפון, מספר אישי…',{class:'input grow','data-fid':'pbq',oninput:e=>{ f.q=e.target.value; schedule(); }}),
        sel([{value:'',label:'כל הפלוגות'}, ...companies().map(c=>({value:c,label:c}))], f.company, {onchange:e=>{ f.company=e.target.value; render(); }}),
        h('span',{class:'small muted'}, list.length + ' אנשי סגל')),
      list.length ? h('div',{class:'tbl-wrap'}, h('table',{class:'tbl'},
        h('thead',null, h('tr',null, PB_COLS.map(c=>h('th',null,c.label)))),
        h('tbody',null, list.map(m => h('tr',{class:'click', onclick:e=>{ if(e.target.closest('a')) return; memberModal(m.id); }},
          PB_COLS.map(c => {
            const v = m[c.k];
            if(c.k==='name') return h('td',{style:{fontWeight:700,whiteSpace:'nowrap'}}, h('span',{style:{display:'inline-flex',alignItems:'center',gap:'8px'}}, avatar(m.id), v));
            if(!v) return h('td',{class:'muted'},'—');
            if(c.k==='phone') return h('td',{dir:'ltr',style:{textAlign:'right',whiteSpace:'nowrap'}}, h('a',{href:'tel:'+String(v).replace(/[^\d+]/g,'')}, v));
            if(c.k==='email') return h('td',{dir:'ltr',style:{textAlign:'right'}}, h('a',{href:'mailto:'+v}, v));
            return h('td',c.ltr?{dir:'ltr',style:{textAlign:'right',whiteSpace:'nowrap'}}:{class:'small'}, v);
          })))))) : empty('לא נמצאו אנשי סגל','phone')));
}

init();
})();
