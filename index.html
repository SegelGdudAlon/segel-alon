<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סגל אלון לא יכרע ברוח</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#1f4a35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="סגל אלון">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ea; --card:#ffffff; --ink:#1c2620; --muted:#69736a; --line:#e3e0d5; --soft:#f7f5ef;
  --brand:#1f4532; --brand-2:#2c5f45; --brand-soft:#e6efe8; --accent:#c48a2c; --accent-soft:#f7ecd6;
  --danger:#b23c2c; --danger-soft:#f8e3df; --warn:#a86f05; --warn-soft:#fbefd2; --ok:#2b7a4b; --ok-soft:#dff1e5;
  --info:#2f63a0; --info-soft:#e2ebf6; --radius:14px; --shadow:0 1px 2px rgba(20,30,20,.06),0 4px 16px rgba(20,30,20,.05);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
a{color:var(--brand-2)}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
[hidden]{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:0 18px;height:60px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-text{font-weight:800;font-size:18px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text span{color:#e9cf98;font-weight:600}
.topbar .spacer{flex:1}
.me-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);padding:4px 6px 4px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
.me-chip .av{width:28px;height:28px;font-size:12px}
.menu-btn{display:none;background:none;border:0;color:#fff;padding:6px;border-radius:8px;cursor:pointer}

/* layout */
.layout{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:calc(100vh - 60px)}
.sidebar{background:var(--card);border-inline-start:0;border-inline-end:1px solid var(--line);padding:14px 10px 30px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
main{padding:24px 28px 80px;min-width:0;max-width:1240px;width:100%}
.nav-group{font-size:12px;font-weight:700;color:var(--muted);padding:14px 12px 6px;letter-spacing:.3px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;margin-bottom:2px}
.nav-item:hover{background:var(--soft)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:700}
.nav-item .nav-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .dot{width:9px;height:9px;border-radius:50%;flex:none}
.nav-item.mine .nav-label::after{content:" •";color:var(--accent)}
.count{min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.count.gray{background:var(--line);color:var(--ink)}
.count.red{background:var(--danger)}
.scrim{display:none}
@media (max-width:920px){
  .menu-btn{display:inline-flex}
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;right:0;bottom:0;width:290px;max-width:86vw;height:auto;z-index:60;transform:translateX(105%);transition:transform .22s ease;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
  .sidebar.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(10,20,14,.35);z-index:55}
  main{padding:16px 12px 80px}
  .brand-text{font-size:16px}
  .me-chip .me-name{display:none}
  .me-chip{padding:3px}
}

/* page head */
.page-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head .ph-text{flex:1;min-width:220px}
.page-head h1{font-size:26px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--muted)}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;min-width:0}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-head h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;flex:1;min-width:150px}
.card-head h2 svg{color:var(--brand-2)}
.card-body{padding:14px 16px}
.card-body.flush{padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2 > .card{margin-bottom:0}
.stack{display:flex;flex-direction:column;gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.form .grid2{gap:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px;line-height:1.2;white-space:nowrap}
.btn.primary{background:var(--brand-2);color:#fff}
.btn.primary:hover{background:var(--brand)}
.btn.accent{background:var(--accent);color:#fff}
.btn.ghost{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.55;cursor:default}
.icon-btn{background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-flex}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}

/* inputs */
.input,select.input,textarea.input{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none}
.input:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(44,95,69,.14)}
textarea.input{min-height:90px;resize:vertical}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field > label{font-size:13px;font-weight:600;color:#3c4a40}
.field .hint{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
.toolbar .input{width:auto;min-width:130px;padding:7px 10px;font-size:14px}
.toolbar .grow{flex:1;min-width:160px}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* chips / tags */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 3px;font-size:13px;max-width:100%}
.chip.me{background:var(--accent-soft);border-color:#ecd3a3}
.chip .x{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 2px;font-size:15px;line-height:1}
.av{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.av.lg{width:38px;height:38px;font-size:14px}
.av-img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.err{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.tag.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.tag.brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.tag.accent{background:var(--accent-soft);color:#8a5d13;border-color:transparent}
.net-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.net-tag i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi-num{font-size:30px;font-weight:800;line-height:1.1}
.kpi-label{color:var(--muted);font-size:13px;font-weight:500;margin-top:2px}
.kpi.red .kpi-num{color:var(--danger)} .kpi.amber .kpi-num{color:var(--accent)} .kpi.green .kpi-num{color:var(--ok)} .kpi.blue .kpi-num{color:var(--info)}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero h1{font-size:24px;font-weight:800}
.hero p{margin:4px 0 0;opacity:.85}
.hero .chips .net-tag{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2);color:#fff;text-decoration:none}

/* lists */
.list-item{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-item .li-main{flex:1;min-width:0}
.li-title{font-weight:600;overflow-wrap:anywhere}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty svg{display:block;margin:0 auto 8px;opacity:.5}

/* rows (bom) */
.rows .row{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1.5fr) 150px 130px 76px;grid-template-areas:"t w d s a";gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.rows .row.head{font-size:12px;color:var(--muted);font-weight:700;border-top:0;background:var(--soft);padding-top:8px;padding-bottom:8px}
.rows .row:first-child{border-top:0}
.c-t{grid-area:t;min-width:0} .c-w{grid-area:w;min-width:0} .c-d{grid-area:d} .c-s{grid-area:s} .c-a{grid-area:a;display:flex;justify-content:flex-end;gap:2px}
.row.done .li-title{text-decoration:line-through;color:var(--muted)}
.row.late{background:linear-gradient(to left,rgba(178,60,44,.05),transparent 40%)}
@media (max-width:760px){
  .rows .row{grid-template-columns:1fr 1fr;grid-template-areas:"t t" "w w" "d s" "a a";gap:8px}
  .rows .row.head{display:none}
  .c-a{justify-content:flex-start}
}
.status-sel{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;width:100%;text-align:center}
.st-todo{background:#eceae3;color:#5a5f57} .st-progress{background:var(--info-soft);color:var(--info)} .st-stuck{background:var(--danger-soft);color:var(--danger)} .st-done{background:var(--ok-soft);color:var(--ok)}
.status-pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.due{font-size:13px;font-weight:600}
.due.late{color:var(--danger)} .due.soon{color:var(--warn)} .due.done{color:var(--muted);font-weight:500}
.note{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere;white-space:pre-wrap}

/* tasks */
.day-head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin:20px 2px 8px}
.day-head .tag{font-weight:600}
.task{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);border-inline-start:4px solid var(--line)}
.task.mine{border-inline-start-color:var(--accent)}
.task-time{font-weight:800;font-size:14px;color:var(--brand);min-width:94px;direction:ltr;text-align:right}
.task-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.task-title{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.task-desc{font-size:14px;color:#3b463e;white-space:pre-wrap;overflow-wrap:anywhere}
.task-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media (max-width:640px){.task{flex-direction:column;gap:6px}.task-time{text-align:right;min-width:0}}

/* staff */
.person{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer}
.person:hover{background:var(--soft)}
.person:first-child{border-top:0}
.person .p-main{flex:1;min-width:0}
.person .p-name{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.group-title{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.nets-grid{display:flex;flex-direction:column;gap:6px}
.net-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.net-row > span{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}

/* leads */
.leads{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lead{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.lead .l-role{font-size:12px;color:var(--muted);font-weight:600}
.lead .l-name{font-weight:700}
@media (max-width:560px){.leads{grid-template-columns:1fr}}
.team-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.team-col h4{font-size:13px;color:var(--muted);margin-bottom:8px}
@media (max-width:700px){.team-cols{grid-template-columns:1fr}}

.progress{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#4aa36d);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.stat{background:var(--soft);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:right;font-size:12px;color:var(--muted);font-weight:700;padding:8px 14px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--soft)}
.tbl-wrap{overflow-x:auto}
.sec-tgl{flex:none;margin-inline-end:-4px}
.sec-collapsed.card > :not(.card-head){display:none!important}
.sec-collapsed:not(.card) > :not(:first-child){display:none!important}
.sec-collapsed:not(.card) > .card:first-child > :not(.card-head){display:none!important}
.sec-collapsed .card-head{border-bottom:0}
.sec-collapsed .fs-btn{display:none}
/* רס״פיות */
.inv-kpis{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:stretch}
.inv-kpis>div{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:5px 12px;display:flex;align-items:baseline;gap:6px}
.inv-kpis b{font-size:17px}.inv-kpis span{font-size:12px;color:var(--muted)}
.inv-kpis .inv-warn{background:var(--warn-soft);border-color:transparent;color:#6e4a06;font-size:12.5px;align-items:center}
.inv-wrap{max-height:70vh;overflow:auto}
.inv-tbl thead th{position:sticky;top:0;z-index:2}
.inv-tbl tfoot td{position:sticky;bottom:0;background:var(--soft);font-weight:800;border-top:2px solid var(--line)}
.inv-tbl td,.inv-tbl th{padding:6px 10px}
.inv-tbl .num{text-align:center;white-space:nowrap}
.inv-tbl .inv-name{font-weight:600;min-width:130px}
.inv-tbl tr.inv-grp td{background:#eef3ee;font-weight:800;font-size:12.5px;color:var(--brand);padding:5px 10px;position:sticky;top:31px;z-index:1}
.inv-c{text-align:center;white-space:nowrap}
.inv-c.ed{cursor:pointer}.inv-c.ed:hover{background:var(--brand-soft)}
.inv-bad{color:var(--danger);font-size:11px;font-weight:700}
.inv-badn{color:var(--danger)}
.inv-num{display:inline-flex;align-items:center;gap:6px}
.inv-num b{min-width:26px;text-align:center}
.inv-step{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:800;line-height:1;color:var(--muted)}
.inv-step:hover{background:var(--brand-soft);color:var(--brand)}
.inv-req{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.inv-req:last-child{border-bottom:0}

/* files */
.file-ic{width:38px;height:38px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
.file-ic.pdf{background:var(--danger-soft);color:var(--danger)}
.file-ic.img{background:var(--info-soft);color:var(--info)}
.file-ic.link{background:var(--accent-soft);color:#8a5d13}
.file-ic.folder{background:#fbefd2;color:#b07a12}
.folder-row{cursor:pointer}.folder-row:hover{background:var(--soft)}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;flex:1;min-width:160px}
.crumb{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:4px 8px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;color:var(--brand-2)}
.crumb:hover{background:#fff}.crumb.cur{color:var(--ink);cursor:default}
.crumbs .sep{color:var(--muted)}
.summary-body{white-space:pre-wrap;font-size:14px;color:#334038;margin-top:6px;overflow-wrap:anywhere}
.summary-body.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.linkish{background:none;border:0;color:var(--brand-2);font-weight:600;cursor:pointer;padding:0;font-size:13px}

/* posts */
.post{padding:12px 16px;border-top:1px solid var(--line)}
.post:first-child{border-top:0}
.post.pinned{background:var(--accent-soft)}
.post-meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:4px}
.post-text{white-space:pre-wrap;overflow-wrap:anywhere}
.composer{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-end}
.composer textarea{min-height:44px}

/* banners */
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;margin-bottom:16px;font-size:14px}
.banner.warn{background:var(--warn-soft);color:#6e4a06}
.banner.info{background:var(--info-soft);color:#1f466f}
.notice{background:var(--warn-soft);color:#3d3a2a;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6}
.notice svg{vertical-align:-2px}
.warn-box{background:var(--warn-soft);color:#6e4a06;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:6px}
.warn-box ul{margin:6px 0 0;padding-inline-start:18px}

/* picker */
.picker{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--soft)}
.pick-tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.pick-tools .input{flex:1;min-width:120px;padding:7px 10px;font-size:14px}
.pick-actions{display:flex;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.pick-list{max-height:240px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
.pick-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.pick-item:first-child{border-top:0}
.pick-item input{width:17px;height:17px;accent-color:var(--brand-2)}
.pick-item .pi-sub{color:var(--muted);font-size:12px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer}
.check input{accent-color:var(--brand-2)}
.search-res{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.hit{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;text-align:right}
.hit:hover{border-color:var(--brand-2)}

/* modal */
.modal-wrap{position:fixed;inset:0;background:rgba(12,22,16,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:18px;font-weight:800}
.modal-body{padding:16px 18px}
.modal-foot{display:flex;gap:8px;justify-content:flex-start;padding:12px 18px;border-top:1px solid var(--line);background:var(--soft);border-radius:0 0 16px 16px;flex-wrap:wrap}
@media (max-width:640px){.modal-wrap{padding:0;align-items:flex-end}.modal{border-radius:16px 16px 0 0;max-height:94vh}.modal-body{overflow:auto}.modal-foot{border-radius:0}}

/* toasts */
/* מסך מלא לטבלאות */
.fs-btn{flex:none}
.fs-host{position:relative}
.fs-float{position:absolute;top:6px;inset-inline-end:6px;z-index:5;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
body.fs-open{overflow:hidden}
.fs-on{position:fixed!important;inset:0!important;z-index:95!important;margin:0!important;border-radius:0!important;max-width:none!important;width:auto!important;height:100vh;height:100dvh;overflow:auto;background:var(--card);display:flex;flex-direction:column}
.fs-on.tk-layout{display:grid;padding:10px;background:var(--bg,#f3f1ea);align-content:start}
.fs-on .tbl-wrap,.fs-on .mgrid-wrap{max-height:none!important;flex:1 1 auto;min-height:0;overflow:auto}
.card.fs-on > .mgrid-wrap,.card.fs-on > .tbl-wrap{flex:1 1 0}
.fs-on .tk-wrap.compact .tkgrid thead th{top:0}
.fs-on .tk-side{top:0;max-height:calc(100dvh - 20px)}
.card.fs-on > .tk-wrap{max-height:none;flex:1 1 0;overflow:auto}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,460px)}
.toast{background:#1c2620;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .2s ease}
.toast.err{background:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* mentoring grid */
.mgrid-wrap{overflow:auto;max-height:72vh;border-top:1px solid var(--line)}
table.mgrid{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.mgrid th,.mgrid td{border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);padding:0}
.mgrid thead th{position:sticky;top:0;z-index:2;background:var(--soft);font-size:12px;font-weight:700;color:#3c4a40;padding:8px 6px;min-width:104px;max-width:120px;text-align:center;line-height:1.25;vertical-align:bottom}
.mgrid thead th.grp-exp{background:#eef2ec}
.mgrid .namecol{position:sticky;right:0;z-index:1;background:#fff;min-width:150px;max-width:190px;text-align:right;padding:8px 12px;font-weight:600;border-inline-start:0;box-shadow:-2px 0 0 var(--line)}
.mgrid thead th.namecol{z-index:3;background:var(--soft)}
.mgrid tfoot td{position:sticky;bottom:0;background:var(--soft);font-size:12px;text-align:center;padding:6px;font-weight:700;color:var(--muted)}
.mgrid tfoot td.namecol{background:var(--soft)}
.mcell,.tk-chip,.tk-cell{-webkit-user-select:none;user-select:none}
.mcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:52px;width:100%;border:0;background:#fff;cursor:pointer;padding:4px 6px;font:inherit;font-size:12px;color:var(--muted);text-align:center}
.mcell:hover{outline:2px solid var(--brand-2);outline-offset:-2px}
.mcell.done{background:#d5eedd;color:#1d5c37}
.mcell.planned{background:var(--accent-soft);color:#7a5210}
.mcell.na{background:repeating-linear-gradient(45deg,#f2f0ea 0 6px,#e9e6dd 6px 12px);color:#8a8f86}
.mcell b{font-size:12px}
.mcell .exp{font-size:11px;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcell .nt{width:6px;height:6px;border-radius:50%;background:var(--info);display:inline-block}
.mcell:disabled{cursor:default}
.mgrid thead tr.r1 th{height:36px;box-sizing:border-box}
.mgrid thead tr.r2 th{top:36px;min-width:66px;max-width:80px;padding:6px 4px;font-size:12px}
.mgrid thead th.grp-head{background:#eae7dd;font-size:13px;vertical-align:middle;letter-spacing:.2px}
.mgrid .gstart{border-inline-start:2px solid #b9b3a3 !important}
.mgrid tr.cad-a td{border-bottom:0}
.mgrid tr.cad-b td,.mgrid tr.cad-a td[rowspan]{border-bottom:2px solid #d6d2c5}
.mgrid tr.cad-b .mcell{min-height:42px;padding:3px 4px}
.xcell{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;border:0;border-inline-start:5px solid #cfcabd;background:#fafaf6;padding:6px 10px;font:inherit;font-size:13px;text-align:right;cursor:pointer;color:var(--ink)}
.xcell:hover{outline:2px solid var(--brand-2);outline-offset:-2px}
.xcell:disabled{cursor:default}
.mgrid td.tyc>.mcell{box-shadow:inset 0 3px 0 var(--tc)}
.xcell .xt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.xcell .xt.ph{color:var(--muted);font-weight:400;font-style:italic}
.xtype{display:inline-flex;align-items:center;padding:1px 9px;border-radius:999px;font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;flex-shrink:0}
.xtype-pick{display:flex;gap:8px;flex-wrap:wrap}
.xtype-pick button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.pct{font-weight:800;color:var(--brand)}
.pies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pie-card{background:var(--soft);border-radius:12px;padding:12px 8px;text-align:center}
.pie-card .pc-t{font-size:13px;font-weight:700;margin-top:6px;line-height:1.25}
.pie-card .pc-s{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.pie-main{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
svg .slice{transition:opacity .15s}
svg .slice:hover{opacity:.8}

/* layout editing */
.layout-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff8e8;border:1px dashed var(--accent);border-radius:12px 12px 0 0;padding:8px 12px;margin-bottom:-1px;font-size:13px}
.layout-bar + .card{border-top-left-radius:0;border-top-right-radius:0;border-color:var(--accent)}
.layout-bar .sp{flex:1}
.add-sec{border:2px dashed var(--line);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:18px}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:right;cursor:pointer}
.type-btn:hover{border-color:var(--brand-2);background:var(--brand-soft)}
.type-btn b{display:block}
.type-btn:disabled{opacity:.45;cursor:default;background:#fff}
@media (max-width:560px){.type-grid{grid-template-columns:1fr}}
.check-item{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid var(--line)}
.check-item:first-child{border-top:0}
.check-item input{width:18px;height:18px;accent-color:var(--brand-2)}
.check-item.done span{text-decoration:line-through;color:var(--muted)}
.text-block{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.col-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}

/* my tasks + tags + done box */
.mt-row{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-top:1px solid var(--line)}
.mt-row:first-child{border-top:0}
.mt-row .li-main{cursor:pointer}
.mt-row.done .li-title{text-decoration:line-through;color:var(--muted)}
.mt-row.late{background:linear-gradient(to left,rgba(178,60,44,.06),transparent 45%)}
.done-box{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid #b9b4a6;border-radius:6px;flex:none;margin:1px 0 0;cursor:pointer;display:grid;place-content:center;background:#fff;transition:background .12s,border-color .12s}
.done-box:hover:not(:disabled){border-color:var(--ok)}
.done-box:checked{background:var(--ok);border-color:var(--ok)}
.done-box:checked::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.done-box:disabled{cursor:default;opacity:.55}
.ct-wrap{display:flex;gap:10px;align-items:flex-start}
.ttag{display:inline-flex;align-items:center;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.tagpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.tagchip.on{background:var(--tc);color:#fff;border-color:var(--tc)}
.tag-add{display:inline-flex;gap:4px;align-items:center}
.tag-add .input{width:150px;padding:5px 9px;font-size:13px}
.sub-head{display:flex;align-items:center;gap:8px;padding:9px 16px;background:var(--soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:#3c4a40}
.task .done-box{margin-top:2px}
.task.isdone .task-title{text-decoration:line-through;color:var(--muted)}

/* derivatives */
.wk-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:6px;scrollbar-width:thin}
.wk-chip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:118px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;cursor:pointer;text-align:right;font:inherit;color:var(--ink)}
.wk-chip b{font-size:14px}
.wk-chip .wk-name{font-size:12px;color:var(--muted);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-chip.cur{border-color:var(--accent)}
.wk-chip.cur b::after{content:' · השבוע';color:var(--accent);font-weight:700;font-size:12px}
.wk-chip.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.wk-chip.on .wk-name,.wk-chip.on .xs{color:rgba(255,255,255,.8)}
.wk-chip.on.cur b::after{color:#f3d9a4}
.wk-bar{display:block;width:100%;height:4px;background:rgba(0,0,0,.08);border-radius:9px;margin-top:5px;overflow:hidden}
.wk-bar i{display:block;height:100%;background:var(--ok)}
.wk-chip.on .wk-bar{background:rgba(255,255,255,.25)}.wk-chip.on .wk-bar i{background:#9fe0b6}
.emph{color:#8a5d13;font-weight:700}

/* תקפ"ץ — תיק פיתוח צוותי */
.tk-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.tk-layout > .card{margin-bottom:0}
.tk-side{position:sticky;top:72px;max-height:calc(100vh - 88px);display:flex;flex-direction:column;margin-bottom:0}
.tk-side .tk-pal-body{overflow:auto;flex:1;min-height:0}
@media (max-width:1180px){.tk-layout{grid-template-columns:1fr}.tk-side{position:static;max-height:none;order:-1}.tk-side .tk-pal-body{max-height:300px}}
.tk-grp{padding:8px 12px 10px;border-top:1px solid var(--line)}
.tk-grp:first-child{border-top:0}
.tk-grp h4{font-size:12px;color:var(--muted);margin:0 0 6px;display:flex;gap:6px;align-items:center;font-weight:700}
.tk-pals,.tk-opts{display:flex;flex-wrap:wrap;gap:5px}
.tk-pal{border:1px solid var(--line);border-inline-start:4px solid var(--tc);background:#fff;border-radius:8px;padding:4px 8px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-align:right;color:var(--ink);line-height:1.3;max-width:100%}
.tk-pal:hover{border-color:var(--tc)}
.tk-pal[draggable="true"]{cursor:grab}
.tk-pal.on{background:var(--tc);color:#fff;border-color:var(--tc);box-shadow:0 0 0 3px rgba(0,0,0,.1)}
.tk-pal.taken{background:var(--soft);color:var(--muted);font-weight:500;border-inline-start-color:#cfcabd;cursor:default}
.tk-pal .who{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.tk-pal.on .who{color:rgba(255,255,255,.85)}
.tk-pal .who.warn{color:var(--warn)}
.tk-wrap{overflow:auto;max-height:74vh;border-top:1px solid var(--line)}
table.tkgrid{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.tkgrid th,.tkgrid td{border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);padding:0;vertical-align:top;height:1px}
.tkgrid thead th{position:sticky;top:0;z-index:2;background:#e6ede7;font-size:12px;font-weight:700;color:#24352a;padding:7px 6px;min-width:112px;text-align:center;line-height:1.25;vertical-align:bottom}
.tkgrid thead th .wk-sub{display:block;font-weight:500;color:var(--muted);font-size:11px}
.tkgrid thead th.curwk{background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent)}
.tkgrid thead th.curwk .wk-sub:first-child{color:#8a5d13;font-weight:700}
.tkgrid td.curwk{background:#fffaf0}
.tkgrid .namecol{position:sticky;right:0;z-index:1;background:#fff;min-width:138px;max-width:170px;padding:8px 10px;font-weight:600;text-align:right;vertical-align:middle;border-inline-start:0;box-shadow:-2px 0 0 var(--line)}
.tkgrid thead th.namecol{z-index:3;background:#e6ede7}
.tkgrid .goalcol{min-width:150px;max-width:190px;background:#f8f7f2}
.tkgrid thead th.goalcol{background:#e6ede7}
.tkgrid .typecol{width:78px;min-width:78px;font-size:11.5px;font-weight:700;padding:6px;vertical-align:middle;text-align:center}
.tkgrid tr.tk-last > td{border-bottom:2px solid #c9c3b3}
.tkgrid tfoot td{position:sticky;bottom:0;background:var(--soft);font-size:12px;text-align:center;padding:6px;font-weight:700;color:var(--muted);height:auto}
.tkgrid tfoot td.namecol{background:var(--soft)}
.tk-cell{min-height:40px;height:100%;padding:4px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.tk-cell:hover{background:rgba(44,95,69,.06)}
.tk-cell.ro{cursor:default}
.tk-cell.ok{background:#e4f4ea;outline:2px dashed var(--ok);outline-offset:-3px}
.tk-cell.ok:hover{background:#cfead9}
.tk-cell.dim{opacity:.35}
.tk-cell.over{background:#cfead9}
.tk-chip{display:flex;align-items:center;gap:4px;height:30px;flex:none;border-radius:7px;padding:0 6px;font-size:11.5px;font-weight:600;line-height:1.2;background:var(--ts);color:#1c2620;border-inline-start:3px solid var(--tc);overflow:hidden}
.tk-chip .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tk-chip.done{background:var(--tc);color:#fff}
.tk-chip.past{box-shadow:inset 0 0 0 1.5px var(--warn)}
.tk-chip.now{box-shadow:inset 0 0 0 1.5px var(--accent)}
.tk-chip.na{opacity:.55;text-decoration:line-through}
.tk-chip .st{flex:none;font-size:11px;font-weight:800}
.tk-chip.past .st{color:var(--warn)}
.tk-chip.multi{border-radius:0;box-shadow:none}
.tk-chip.multi.past{box-shadow:inset 0 1.5px 0 var(--warn),inset 0 -1.5px 0 var(--warn)}
.tk-chip.multi.now{box-shadow:inset 0 1.5px 0 var(--accent),inset 0 -1.5px 0 var(--accent)}
.tk-chip.multi:not(.first){margin-inline-start:-5px;border-inline-start:0}
.tk-chip.multi:not(.last){margin-inline-end:-5px}
.tk-chip.multi.first{border-start-start-radius:7px;border-end-start-radius:7px;overflow:visible}
.tk-chip.multi.last{border-start-end-radius:7px;border-end-end-radius:7px}
.tk-chip.multi.first .tx{display:block;white-space:nowrap;position:relative;z-index:1;overflow:visible}
.tk-ph{height:30px;flex:none;display:block}
.tk-goal{padding:6px 8px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;color:#3b463e;height:100%;min-height:60px;cursor:pointer}
.tk-goal.ro{cursor:default}
.tk-goal .ph{color:var(--muted);font-style:italic}
.tk-req{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.tk-req span{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:999px;white-space:nowrap}
.tk-req .y{background:var(--ok-soft);color:var(--ok)}
.tk-req .n{background:var(--danger-soft);color:var(--danger)}
.tk-dots{display:flex;gap:3px;align-items:center;margin-top:5px;font-size:10.5px;color:var(--muted);font-weight:500}
.tk-dots i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid #cfcabd;background:#fff}
.tk-dots i.done{background:var(--ok);border-color:var(--ok)}
.tk-dots i.planned{background:var(--accent);border-color:var(--accent)}
.tk-dots i.na{background:#e3e0d5}
.tk-cnt{text-align:center;font-weight:800;vertical-align:middle!important;padding:6px!important;min-width:46px}
.tk-cnt.zero{color:var(--danger);background:var(--danger-soft)}
.tk-selbar{position:sticky;top:64px;z-index:30;box-shadow:var(--shadow)}
.tk-slot{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;flex-wrap:wrap}
.tk-slot .input{width:auto;padding:5px 8px;font-size:13px}
.tk-cat-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
.tk-cat-row:first-child{border-top:0}
.tkgrid .namecol.t1{background:#e3f3e8;box-shadow:-2px 0 0 var(--line),inset -5px 0 0 var(--ok)}
.tkgrid .namecol.t2{background:#fbf0da;box-shadow:-2px 0 0 var(--line),inset -5px 0 0 var(--accent)}
.tkgrid .namecol.t3{background:#f9e4e0;box-shadow:-2px 0 0 var(--line),inset -5px 0 0 var(--danger)}
.tk-nm{display:flex;align-items:center;gap:6px}
.tk-rank{flex:none;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.08);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
/* תקפ״ץ — תצוגה מוקטנת (ברירת מחדל): הכול נכנס לרוחב המסך כמו באקסל */
.tk-wrap.compact{max-height:none;overflow:visible}
.tk-wrap.compact .tkgrid thead th{top:60px}
.tk-wrap.compact table.tkgrid{font-size:11px;table-layout:fixed;width:100%;min-width:620px}
@media (max-width:1180px){.tk-wrap.compact{max-height:calc(100vh - 130px);overflow:auto}.tk-wrap.compact .tkgrid thead th{top:0}}
.tk-wrap.compact .tkgrid thead th{min-width:0;padding:3px 2px;font-size:10.5px;line-height:1.15}
.tk-wrap.compact .tkgrid thead th .wk-sub{font-size:9.5px}
.tk-wrap.compact .tkgrid .namecol{width:124px;min-width:0;max-width:none;padding:3px 5px;font-size:11.5px}
.tk-wrap.compact .tkgrid .goalcol{width:84px;min-width:0;max-width:none}
.tk-wrap.compact .tkgrid .typecol{width:38px;min-width:0;font-size:9.5px;padding:2px;line-height:1.1}
.tk-wrap.compact .tkgrid .cntcol{width:30px;min-width:0!important}

    m.append(document.createTextNode(t));
    if(withCopy){ const b = document.createElement('button'); b.type = 'button'; b.className = 'copy-link'; b.textContent = 'העתקת הקישור';

      m.append(document.createElement('br'), b); } };
  const inApp = /FBAN|FBAV|FB_IAB|Instagram|WhatsApp|Line\/|Telegram|Snapchat|TikTok|musical_ly|; wv\)|GSA\//i.test(navigator.userAgent);
  return {
    ready(c){ Object.assign(caps, c); const b = box(); if(b) b.hidden = true; resolveReady(); },
    showSignIn(fn){ const b = box(); if(!b) return; b.hidden = false; document.getElementById('signin-btn').hidden = false; document.getElementById('signin-btn').onclick = () => { msg(''); fn(); };
      if(inApp) msg('הקישור נפתח בתוך אפליקציה (וואטסאפ, אינסטגרם וכד׳), ושם Google לא מאפשר להתחבר. פתחו אותו ב-Safari או ב-Chrome: בתפריט ⋯ בוחרים ״פתיחה בדפדפן״, או מעתיקים את הקישור.', true); },

    fail(t){ const b = box(); if(b){ b.hidden = false; document.getElementById('signin-btn').hidden = true; } msg(t); },
    use: async name => { await readyP; return caps[name] ?? null; },
  };

    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);

  }
  for (const kid of kids.flat(Infinity)){
    if (kid == null || kid === false) continue;

async function init(){

  const slowT = setTimeout(()=>{ S.slow=true; schedule(); }, 10000);
  const [db, user] = await Promise.all([c.use('db'), c.use('user')]);

  S.me = { id: me && me.id || null, isOwner: !!(me && me.isOwner), name: me && me.name || '', email: me && me.email || null };

  c.use('assets').then(a=>{ S.assets=a; schedule(); }).catch(()=>{});

function listen(name, fn){

  }, err => { console.warn(name, err); schedule(); });
}
function subscribeAll(onFirst){

    const m = {}; snap.docs.forEach(d => { if(d.exists) m[d.id] = d.data(); });

          f.scope==='all' && !(b.assignees||[]).includes(me) ? h('span',{class:'xs muted'}, (b.assignees||[]).length ? (b.assignees||[]).map(nameOf).join(', ') : 'לא שויך')
            : others.length ? h('span',{class:'xs muted'}, 'יחד עם ' + others.map(nameOf).join(', ')) : null),
        b.notes ? h('div',{class:'note'}, b.notes) : null));
  };
  const evRow = t => {
    const done = !!(t.doneBy && t.doneBy[me]);
    return h('div',{class:'mt-row'+(done?' done':'')},
      doneBox(done, false, v => act(S.db.doc('tasks/'+t.id).update({ doneBy:{ [me]: v } }))),

        h('div',{class:'li-title'}, t.title),
        h('div',{class:'chips',style:{marginTop:'4px',alignItems:'center'}},
          h('span',{class:'tag info'}, icon('clock',12), fmtDay(t.start.slice(0,10)).split(',')[0], ' · ', timeRange(t)),
          t.net && NET_BY_ID[t.net] ? netTag(NET_BY_ID[t.net]) : null,
          t.location ? h('span',{class:'xs muted'}, '📍 ' + t.location) : null)));
  };
  const tagBar = tagsHere.length ? h('div',{class:'tagpick'},
    h('button',{type:'button',class:'tagchip'+(f.tag?'':' on'),style:{'--tc':'var(--brand-2)'},onclick:()=>{ f.tag=''; render(); }}, 'כל התגיות'),
    tagsHere.map(t => h('button',{type:'button',class:'tagchip'+(f.tag===t?' on':''),style:{'--tc':tagColor(t)},onclick:()=>{ f.tag = f.tag===t ? '' : t; render(); }}, t))) : null;
  return card('המשימות שלי','check',
    [ h('span',{class:'tag'}, openN + ' פתוחות'), lateN ? h('span',{class:'tag err'}, lateN + ' באיחור') : null,
      h('button',{class:'btn primary sm',onclick:()=>bomModal('general', null, { home:true })}, icon('plus',16),'משימה חדשה') ],
    h('div',{class:'toolbar'},
      segmented([{id:'mine',label:'משויכות אליי'},{id:'all',label:'כל המשימות הכלליות'}], f.scope, v=>{ f.scope=v; render(); }),
      segmented([{id:'open',label:'פתוחות'},{id:'done',label:`בוצעו (${doneN})`},{id:'all',label:'הכל'}], f.status, v=>{ f.status=v; render(); }),
      tagBar),
    h('div',{class:'card-body flush'},
      items.length ? items.map(row) : empty(f.status==='done' ? 'עדיין לא סומנו משימות כבוצעות' : f.tag ? 'אין משימות עם התגית הזו' : 'אין משימות פתוחות 👌','check'),
      events.length && f.scope==='mine' && f.status!=='done' && !f.tag ? [ h('div',{class:'sub-head'}, icon('cal',15), 'ביומן ב-7 הימים הקרובים', h('span',{style:{flex:1}}), h('a',{href:'#tasks',class:'xs',style:{fontWeight:600}},'לכל המשימות ביומן')), events.map(evRow) ] : null));
}
function netStats(netId){
  const items = S.bom.filter(b => b.net===netId);
  const done = items.filter(b => b.status==='done').length;
  const sums = S.files.filter(f => f.net===netId && f.kind==='summary').map(f => f.date||'').filter(Boolean).sort();
  return { total:items.length, done, open:items.length-done, overdue:items.filter(isOverdue).length, stuck:items.filter(b=>b.status==='stuck').length,
    pct: items.length ? Math.round(done*100/items.length) : 0, lastSummary: sums[sums.length-1] || '' };
}

/* ---------- BOM (בקרה ומעקב) ---------- */
function dueBadge(b){
  if(!b.due) return h('span',{class:'due muted'},'ללא תג״ב');
  const d = daysUntil(b.due);
  if(b.status==='done') return h('span',{class:'due done'}, fmtDate(b.due));
  if(d < 0) return h('span',{class:'due late'}, `${fmtDate(b.due)} · באיחור ${-d===1?'יום':(-d)+' ימים'}`);
  if(d === 0) return h('span',{class:'due soon'}, 'היום');
  if(d === 1) return h('span',{class:'due soon'}, 'מחר');
  if(d <= 3) return h('span',{class:'due soon'}, `${fmtDate(b.due)} · עוד ${d} ימים`);
  return h('span',{class:'due'}, fmtDate(b.due));
}
const allTags = () => (Array.isArray(S.config.tags) ? S.config.tags : DEFAULT_TAGS);
function tagColor(t){ let x=7; for(const c of String(t)) x=(x*33+c.charCodeAt(0))>>>0; return NET_COLORS[x % NET_COLORS.length]; }
function tagEl(t){ const c = tagColor(t); return h('span',{class:'ttag',style:{color:c,background:c+'1c'}}, t); }
function tagPicker(initial){
  const chosen = new Set(initial || []);
  const wrap = h('div',{class:'tagpick'});
  const input = inp('', 'תגית חדשה…');
  const add = () => { const v = input.value.trim().replace(/\s+/g,' ').slice(0,30); if(v) chosen.add(v); input.value=''; draw(); input.focus(); };
  input.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); add(); } });
  function draw(){
    const list = [...new Set([...allTags(), ...chosen])];
    wrap.replaceChildren(...list.map(t => h('button',{type:'button', class:'tagchip'+(chosen.has(t)?' on':''), style:{'--tc':tagColor(t)}, onclick:()=>{ chosen.has(t) ? chosen.delete(t) : chosen.add(t); draw(); }}, t)),
      h('span',{class:'tag-add'}, input, h('button',{type:'button',class:'btn ghost sm',onclick:add}, icon('plus',14))));
  }
  draw();
  return { el:wrap, get:()=>[...chosen] };
}
function rememberTags(tags){
  const lib = allTags(), fresh = (tags||[]).filter(t => !lib.includes(t));
  if(fresh.length) S.db.doc('app/config').set(Object.assign({}, S.config, { tags:[...lib, ...fresh] })).catch(()=>{});
}
const canEditBom = b => b.net==='general' || isAdmin() || inNet(S.me.id, b.net) || (b.assignees||[]).includes(S.me.id);
function toggleBomDone(b, checked){
  const now = Date.now();
  const data = checked
    ? { status:'done', prevStatus:(b.status && b.status!=='done') ? b.status : 'todo', doneAt:now, doneBy:S.me.id, updatedAt:now, updatedBy:S.me.id }
    : { status:(b.prevStatus && b.prevStatus!=='done') ? b.prevStatus : 'todo', updatedAt:now, updatedBy:S.me.id };
  return act(S.db.doc('bom/'+b.id).update(data), checked ? 'סומן כבוצע ✓' : null);
}
function doneBox(checked, disabled, onChange){
  return h('input',{type:'checkbox', class:'done-box', checked, disabled, title: checked ? 'בוצע — לחצו לביטול' : 'סימון כבוצע', 'aria-label':'בוצע', onchange:e=>onChange(e.target.checked)});
}

    [ h('span',{class:'tag'}, counts.open+' פתוחים'), counts.late ? h('span',{class:'tag err'}, counts.late+' באיחור') : null,
      ctx.editable ? h('button',{class:'btn primary sm',onclick:()=>bomModal(netId)}, icon('plus',16),'משימה חדשה') : null ],

    body: h('div',{class:'form'}, field('משימה *', title),

      : await act(S.db.doc('bom/'+b.id).set(Object.assign({}, stripId(b), data)), 'עודכן');

const stripId = o => { const c = Object.assign({}, o); delete c.id; return c; };

/* ---------- people picker ---------- */
function peoplePicker(initial, opts){
  opts = opts || {};
  const chosen = new Set(initial || []);
  const st = { q:'', company:'', net: (opts.netId && opts.netId!=='general') ? opts.netId : '', onlyNet: !!(opts.netId && opts.netId!=='general') };
  const chipsEl = h('div',{class:'chips'});
  const listEl = h('div',{class:'pick-list'});
  const q = inp('', 'חיפוש שם…', { oninput:e=>{ st.q=e.target.value; draw(); } });
  const comp = sel([{value:'',label:'כל הפלוגות'}, ...companies().map(c=>({value:c,label:c}))], '', { onchange:e=>{ st.company=e.target.value; draw(); } });
  const onlyBox = h('input',{type:'checkbox', checked:st.onlyNet, onchange:e=>{ st.onlyNet=e.target.checked; draw(); }});
  const onlyLabel = h('label',{class:'check'}, onlyBox, h('span',null,''));
  function visible(){
    return allMembers().filter(m =>
      (!st.q || nameOf(m.id).includes(st.q) || (m.position||'').includes(st.q)) &&
      (!st.company || m.company===st.company) &&
      (!st.onlyNet || !st.net || inNet(m.id, st.net)));
  }
  function draw(){
    onlyLabel.hidden = !st.net;
    onlyLabel.lastChild.textContent = st.net ? 'רק משויכי ' + NET_BY_ID[st.net].name : '';
    onlyBox.checked = st.onlyNet;
    chipsEl.replaceChildren(...(chosen.size ? [...chosen].map(id => personChip(id, ()=>{ chosen.delete(id); draw(); })) : [h('span',{class:'muted small'},'לא נבחרו אנשים')]));
    const vis = visible();
    listEl.replaceChildren(...(vis.length ? vis.map(m => {
      const cb = h('input',{type:'checkbox', checked:chosen.has(m.id), onchange:e=>{ e.target.checked ? chosen.add(m.id) : chosen.delete(m.id); draw(); }});
      const lv = st.net ? netLevel(m.id, st.net) : null;
      return h('label',{class:'pick-item'}, cb, avatar(m.id), h('div',null, h('div',null,nameOf(m.id)), h('div',{class:'pi-sub'}, [m.position, m.company, lv ? LEVEL_LABEL[lv] : (st.net && isLead(m.id,st.net) ? 'מוביל' : '')].filter(Boolean).join(' · '))));
    }) : [h('div',{class:'empty'}, 'אין אנשים שתואמים לחיפוש')]));
  }
  const el = h('div',{class:'picker'}, chipsEl,
    h('div',{class:'pick-tools'}, q, comp),
    h('div',{class:'pick-actions'}, onlyLabel,
      h('button',{type:'button',class:'linkish',onclick:()=>{ visible().forEach(m=>chosen.add(m.id)); draw(); }}, 'סימון כל המוצגים'),
      h('button',{type:'button',class:'linkish',onclick:()=>{ chosen.clear(); draw(); }}, 'ניקוי')),
    listEl);
  draw();
  return { el, get:()=>[...chosen], setNet(n){ st.net = (n && n!=='general') ? n : ''; st.onlyNet = !!st.net; draw(); } };
}

/* ---------- files & summaries ---------- */
const ACCEPT = '.pdf,image/*,.txt,.csv,.md,.json,video/*';
async function uploadFile(file){
  if(!S.assets) throw { heb:'העלאת קבצים אינה זמינה עבורך — בקש מבעל הדף הרשאת ״עורך״ או ״תורם״, או הוסף קישור לקובץ.' };
  if(file.size > 20*1024*1024) throw { heb:`הקובץ "${file.name}" גדול מ-20MB. העלו אותו ל-Drive והוסיפו קישור.` };
  try { return await S.assets.upload(file); }
  catch(e){ console.warn(e); throw { heb:`לא ניתן להעלות את "${file.name}". נתמכים: PDF, תמונות, וידאו וטקסט. קובץ Word/Excel/PowerPoint — שמרו כ-PDF או הוסיפו קישור ל-Drive.` }; }
}

function folderTree(folders, parent, depth, out){
  out = out || []; parent = parent || ''; depth = depth || 0;
  folders.filter(f => (f.parent||'')===parent).sort((a,b)=>(a.name||'').localeCompare(b.name||'','he'))
    .forEach(f => { out.push({ f, depth }); folderTree(folders, f.id, depth+1, out); });
  return out;
}

  el.classList.toggle('sec-collapsed', on);
  const toggle = () => { secSetCollapsed(key, !secCollapsed(key)); render(); };

function gcalUrl(t){
  const f = s => s ? s.replace(/[-:]/g,'').slice(0,13) + '00' : '';
  const p = new URLSearchParams({ action:'TEMPLATE', text:t.title||'', dates:`${f(t.start)}/${f(t.end||t.start)}`, details:t.desc||'', location:t.location||'', ctz:'Asia/Jerusalem' });
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}
function findConflicts(data, excludeId){
  const out = [];
  for(const t of S.tasks){
    if(t.id===excludeId || !t.start || !t.end) continue;
    if(!(data.start < t.end && t.start < data.end)) continue;
    for(const uid of data.assignees) if((t.assignees||[]).includes(uid)) out.push({ uid, task:t });
  }
  return out;
}
function tasksView(){

  if(f.net) list = list.filter(t => (t.net||'')===f.net);
  if(f.when==='upcoming') list = list.filter(t => (t.end||t.start||'') >= now);
  if(f.when==='past') list = list.filter(t => (t.end||t.start||'') < now);
  list.sort((a,b) => f.when==='past' ? (b.start||'').localeCompare(a.start||'') : (a.start||'').localeCompare(b.start||''));
  const groups = [];
  list.forEach(t => { const d=(t.start||'').slice(0,10); const g=groups[groups.length-1]; if(g && g.d===d) g.items.push(t); else groups.push({d, items:[t]}); });

function taskModal(t){
  const isNew = !t; t = t || {};
  const tm = addDays(todayStr(),1);
  const title = inp(t.title, 'לדוגמה: תרגיל פלוגתי / הכנת שטח');
  const start = inp(t.start || tm+'T08:00', '', {type:'datetime-local'});
  const end = inp(t.end || tm+'T10:00', '', {type:'datetime-local'});
  const loc = inp(t.location, 'מיקום');
  const net = sel([{value:'',label:'ללא / כללי'}, ...NETS.map(n=>({value:n.id,label:n.name}))], t.net||'');
  const desc = h('textarea',{class:'input', placeholder:'פירוט, ציוד נדרש, הנחיות…', value:t.desc||''});
  const picker = peoplePicker(t.assignees || [], { netId:t.net||'' });
  net.addEventListener('change', () => picker.setNet(net.value));
  start.addEventListener('change', () => { if(end.value <= start.value){ const d=parseLocal(start.value); d.setHours(d.getHours()+2); end.value = `${dstr(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; } });
  const warn = h('div',{class:'warn-box', hidden:true});
  let confirmed = false;
  const save = h('button',{class:'btn primary'}, isNew ? 'יצירת משימה' : 'שמירה');
  const close = openModal({ title: isNew ? 'משימה חדשה' : 'עריכת משימה', wide:true,
    body: h('div',{class:'form'}, field('שם המשימה *', title),
      h('div',{class:'grid2'}, field('התחלה *', start), field('סיום *', end)),
      h('div',{class:'grid2'}, field('מיקום', loc), field('נע״ת קשור', net)),
      field('שיוך מפקצים', picker.el), field('פירוט', desc), warn),
    footer:[ save, h('button',{class:'btn ghost',onclick:()=>close()},'ביטול') ] });
  save.addEventListener('click', async () => {
    const data = { title:title.value.trim(), start:start.value, end:end.value, location:loc.value.trim(), net:net.value, desc:desc.value.trim(), assignees:picker.get() };
    if(!data.title) return toast('נא למלא שם משימה','err');
    if(!data.start || !data.end) return toast('נא למלא שעת התחלה וסיום','err');
    if(data.end <= data.start) return toast('שעת הסיום חייבת להיות אחרי ההתחלה','err');
    if(!confirmed){
      const c = findConflicts(data, t.id);
      if(c.length){
        warn.hidden = false;
        warn.replaceChildren(h('b',null,'שימו לב — חפיפה עם משימות קיימות:'), h('ul',null, c.map(x => h('li',null, `${nameOf(x.uid)}: ${x.task.title} (${fmtDate(x.task.start.slice(0,10))} ${timeRange(x.task)})`))));
        confirmed = true; save.textContent = 'שמירה בכל זאת'; return;
      }
    }
    save.disabled = true;
    const ok = isNew
      ? await act(S.db.collection('tasks').add(Object.assign(data, { createdBy:S.me.id, createdAt:Date.now(), calSent:false })), 'המשימה נוצרה')
      : await act(S.db.doc('tasks/'+t.id).set(Object.assign(stripId(t), data, { updatedAt:Date.now() })), 'המשימה עודכנה');
    save.disabled = false;
    if(ok) close();
  });
}
async function sendInvites(t){
  const ids = t.assignees || [];
  const withMail = ids.filter(id => S.members[id] && S.members[id].email);
  const without = ids.filter(id => !(S.members[id] && S.members[id].email));
  if(!withMail.length) return toast('לאף אחד מהמשויכים לא הוגדר מייל. הוסיפו מיילים בלשונית ״אנשי סגל״.','err');
  const ok = await confirmDialog('שליחת זימונים ביומן גוגל', h('div',null,
    h('p',{style:{marginTop:0}}, `ייווצר אירוע ביומן הגוגל שלך — "${t.title}", ${fmtDate(t.start.slice(0,10))} ${timeRange(t)} — וזימון יישלח אל:`),
    h('div',{class:'chips'}, withMail.map(id => personChip(id))),
    without.length ? h('p',{class:'small',style:{color:'var(--warn)'}}, 'ללא מייל (לא יקבלו זימון): ' + without.map(nameOf).join(', ')) : null), 'שליחת זימונים');
  if(!ok) return;
  toast('שולח זימונים…');
  try {
    await S.mcp.callTool(GCAL_SERVER, 'create_event', {
      summary: t.title, description: [t.desc, 'נוצר מאתר סגל אלון לא יכרע ברוח'].filter(Boolean).join('\n\n'),
      location: t.location || undefined, startTime: t.start + ':00', endTime: t.end + ':00', timeZone: 'Asia/Jerusalem',
      attendees: withMail.map(id => ({ email: S.members[id].email, displayName: nameOf(id) })) });
    await act(S.db.doc('tasks/'+t.id).update({ calSent:true, calSentBy:S.me.id, calSentAt:Date.now() }));
    toast('הזימונים נשלחו ✔');
  } catch(e){
    console.warn(e);
    const c = e && e.code;
    const m = {
      server_not_connected: 'Google Calendar לא מחובר לחשבון שלך. חברו אותו ב-claude.ai ← הגדרות ← Connectors.',
      needs_reauth: 'צריך להתחבר מחדש ל-Google Calendar ב-claude.ai ← הגדרות ← Connectors.',
      selection_required: 'יש לבחור איזה חיבור Google Calendar לשמש (בחלון שנפתח ב-claude.ai).',
      not_in_manifest: 'לא אושרה גישה ליומן מהדף הזה.',
      approval_required: 'צריך לאשר את הגישה ליומן — נסו שוב ואשרו בחלון שנפתח.',
      blocked_by_policy: 'הארגון חוסם יצירת אירועים מהדף.',
      server_unavailable: 'היומן לא הגיב. ייתכן שהאירוע בכל זאת נוצר — בדקו ביומן לפני ניסיון נוסף.',

      tool_error: 'היומן החזיר שגיאה: ' + (e && e.message || ''),

const EXPORT_COLLECTIONS = ['app','archives','blocks','bom','cadets','deriv','drv','files','folders','members','nets','posts','requests','rooms','tasks','tkf','invStock','invReq','invMeta','invLog'];
async function exportAllData(){
  if(!S.downloads) return toast('הורדת קבצים לא זמינה בתצוגה הזו','err');
  toast('אוסף את כל הנתונים…');
  try {
    const out = { app:'segel-alon', exportedAt:new Date().toISOString(), collections:{} };
    for(const c of EXPORT_COLLECTIONS){
      const snap = await S.db.collection(c).get();
      out.collections[c] = {};
      snap.docs.forEach(d => { if(d.exists) out.collections[c][d.id] = d.data(); });
    }
    const n = Object.values(out.collections).reduce((a,x) => a + Object.keys(x).length, 0);
    await S.downloads.save({ filename:'segel-alon-data-' + todayStr() + '.json', data:JSON.stringify(out) });
    toast(`יוצאו ${n} רשומות`);
  } catch(e){ if(e && e.code==='declined') return; console.warn(e); toast(errMsg(e),'err'); }
}

function pieSvg(segs, size, center, sub){

      tip(path, s); svg.append(path); a = a2;
    });

function tkfPalette(cadets, editable, taken){
  const T = UI.tk, cat = tkfCatalog();
  const q = normQ(T.q);
  const chip = it => {
    const tk = taken[it.id], ty = expTy(it.type), [a, b] = itemRange(it);
    if(T.hideTaken && tk) return null;
    if(q && !normQ(itemLabel(it) + ' ' + (it.note||'')).includes(q)) return null;
    return h('button',{type:'button', class:'tk-pal' + (T.sel===it.id ? ' on' : '') + (tk ? ' taken' : ''), style:{'--tc':ty.color},
      title: tk ? `שובץ אצל ${tk.c.name} · ${rangeLabel(tk.s.week, tk.s.end)}` : `${rangeLabel(a,b)}` + (editable ? ' · לחצו לבחירה ואז על תא בטבלה, או גררו לתא' : ''),
      draggable: editable && !tk ? 'true' : null,
      ondragstart: e => { T.drag = it.id; try { e.dataTransfer.setData('text/plain', it.id); e.dataTransfer.effectAllowed = 'copy'; } catch {} },
      ondragend: () => { T.drag = null; },
      onclick: () => {
        if(tk){ toast(`"${itemLabel(it)}" כבר משובצת אצל ${tk.c.name} (${rangeLabel(tk.s.week, tk.s.end)})`); return; }
        if(!editable) return;
        T.sel = T.sel===it.id ? null : it.id; render();
      } },
      itemLabel(it), it.note ? h('span',{class:'xs',style:{fontWeight:500}}, ' (' + it.note + ')') : null,
      tk ? h('span',{class:'who'}, '✓ ' + tk.c.name) : (b > a ? h('span',{class:'who'}, rangeLabel(a,b)) : null));
  };
  const groups = [];
  groups.push({ title:'ממ״ש — שבוע לכל ממ״ש', sub:'פיקודית', items: cat.filter(it => it.mms) });
  TKF_WEEKS.forEach(w => groups.push({ title:`שבוע ${w.n} · ${w.name}`, sub:'הדרכתית', items: cat.filter(it => it.type==='teach' && itemRange(it)[0]===w.n && itemRange(it)[1]===w.n) }));
  groups.push({ title:'הדרכתיות נוספות', items: cat.filter(it => it.type==='teach' && itemRange(it)[1] > itemRange(it)[0]) });
  TKF_SCOPES.forEach(s => groups.push({ title:s.label, sub:'פיקודית', scope:s.id, items: cat.filter(it => it.type!=='teach' && !it.mms && (it.scope||'team')===s.id) }));
  // פלוגתיות וגדודיות לא בהכרח משובצות בכל צוות — לא נספרות ב״כמה שובצו מתוך כמה״
  const teamItems = cat.filter(isTeamItem);
  const used = teamItems.filter(it => taken[it.id]).length;
  const extraUsed = cat.filter(it => !isTeamItem(it) && taken[it.id]).length;
  const rendered = groups.map(g => {
    const chips = g.items.map(chip).filter(Boolean); if(!chips.length) return null;
    const u = g.items.filter(it => taken[it.id]).length;
    const cnt = g.scope && g.scope!=='team' ? (u ? u + ' שובצו' : '') : u + '/' + g.items.length;
    return h('div',{class:'tk-grp'}, h('h4',null, g.title, g.sub ? h('span',{style:{fontWeight:500}}, '· ' + g.sub) : null, cnt ? h('span',{class:'count gray',style:{marginInlineStart:'auto'}}, cnt) : null), h('div',{class:'tk-pals'}, chips));
  }).filter(Boolean);
  return h('aside',{class:'card tk-side'},
    h('div',{class:'card-head',style:{flexWrap:'nowrap'}}, h('h2',{style:{minWidth:0,whiteSpace:'nowrap',fontSize:'16px'}}, icon('list'), 'מאגר התנסויות'),
      h('span',{class:'tag',title:'התנסויות צוותיות (ממ״ש, הדרכתיות ורוחב צוותי). פלוגתיות וגדודיות לא נספרות.'}, `${used}/${teamItems.length} שובצו` + (extraUsed ? ` · +${extraUsed}` : '')),
      isAdmin() ? h('button',{class:'icon-btn',title:'עריכת המאגר',onclick:tkfCatalogModal}, icon('gear',16)) : null),
    h('div',{class:'toolbar',style:{padding:'8px 12px'}},
      inp(T.q, 'חיפוש…', {class:'input grow','data-fid':'tkq', style:{minWidth:'100px'}, oninput:e => { T.q = e.target.value; schedule(); }}),
      h('label',{class:'check'}, h('input',{type:'checkbox', checked:T.hideTaken, onchange:e => { T.hideTaken = e.target.checked; render(); }}), 'הסתרת משובצות'),
      editable ? h('button',{class:'btn accent sm',style:{width:'100%'},onclick:()=>tkfCustomModal(cadets)}, icon('plus',15),'משימה / התנסות מותאמת') : null),
    h('div',{class:'tk-pal-body'}, rendered.length ? rendered : empty('אין התנסויות תואמות','list')));
}

function tkfCustomModal(cadets){
  if(!cadets.length) return toast('הוסיפו קודם צוערים','err');
  const curN = currentWeekN(), w0 = curN>=1 && curN<=8 ? curN : 1;
  const cs = sel(cadets.map(c => ({ value:c.id, label:c.name })), cadets[0].id);
  let type = 'task';
  const tp = segmented(EXP_TYPES.map(t => ({ id:t.id, label:t.label })), type, v => { type = v; });
  const wk = sel(TKF_WEEKS.map(w => ({ value:String(w.n), label:`שבוע ${w.n} · ${w.name}` })), String(w0));
  const we = weekSel(1, 8, w0, { style:{} });
  wk.addEventListener('change', () => { if(+we.value < +wk.value) we.value = wk.value; });
  const txt = inp('', 'מה המשימה / ההתנסות?');
  const save = h('button',{class:'btn primary'}, 'שיבוץ');
  const close = openModal({ title:'משימה / התנסות מותאמת',
    body: h('div',{class:'form'}, field('צוער', cs), field('סוג', tp, 'משימה = לא פיקודית, לא הדרכתית ולא צח״ץ — לבחירת המפק״ץ, למי שהוא רוצה להוריד.'),
      h('div',{class:'grid2'}, field('משבוע', wk), field('עד שבוע', we)), field('תיאור *', txt)),
    footer:[ save, h('button',{class:'btn ghost',onclick:()=>close()},'ביטול') ] });
  setTimeout(() => txt.focus(), 50);
  save.addEventListener('click', async () => {
    const t = txt.value.trim(); if(!t) return toast('נא למלא תיאור','err');
    const c = S.cadets.find(x => x.id===cs.value); if(!c) return;
    save.disabled = true;
    if(await tkfPlace(c, { type, text:t, week:+wk.value, end:Math.max(+wk.value, +we.value) })) close();
    save.disabled = false;
  });
}

async function tkfExport(mentor, per){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
  const rows = [ ['#','שם הצוער','סוג', ...TKF_WEEKS.map(w => w.name), 'כמות'], ['','','', ...TKF_WEEKS.map(w => w.n), ''] ];
  per.forEach((p, pi) => TKF_ROWS.forEach((row, ri) => {
    const ss = p.ss.filter(s => tkfRowOf(s.type)===row.id);
    rows.push([ ri===0 ? pi+1 : '', ri===0 ? p.c.name : '', row.label,
      ...TKF_WEEKS.map(w => ss.filter(s => s.week <= w.n && w.n <= s.end).map(s => s.text).join(' / ')), ss.length ]);
  }));
  const csv = '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
  try { await S.downloads.save({ filename:'תקפ״ץ ' + cohortName(viewCohortId()) + ' - ' + nameOf(mentor) + '.csv', data:csv }); }
  catch(e){ if(e && e.code!=='declined') toast('לא ניתן להוריד את הקובץ מהתצוגה הזו','err'); }
}

function cdParts(end){
  const t = parseLocal(end + 'T23:59').getTime() + 59000 - Date.now();
  if(isNaN(t)) return null;
  const over = t <= 0, a = Math.abs(t);
  return { over, d:Math.floor(a/864e5), h:Math.floor(a/36e5)%24, m:Math.floor(a/6e4)%60, s:Math.floor(a/1e3)%60 };
}
function countdownEl(end, compact){
  const el = h('span',{class:'cd'+(compact?' compact':''), 'data-cd':end});
  fillCountdown(el); return el;
}
function fillCountdown(el){
  const p = cdParts(el.dataset.cd); if(!p) { el.textContent = ''; return; }
  if(el.classList.contains('compact')){ el.textContent = p.over ? 'המחזור הסתיים' : `נותרו ${p.d} ימים · ${pad(p.h)}:${pad(p.m)}:${pad(p.s)}`; return; }
  if(p.over){ el.replaceChildren(h('b',{class:'cd-over'}, 'המחזור הסתיים')); return; }
  el.replaceChildren(...[[p.d,'ימים'],[pad(p.h),'שעות'],[pad(p.m),'דקות'],[pad(p.s),'שניות']].map(([v,l]) => h('span',{class:'cd-b'}, h('b',null,v), h('i',null,l))));
}
let cdTimer = null;
function startCountdowns(){ if(cdTimer) return; cdTimer = setInterval(() => document.querySelectorAll('[data-cd]').forEach(fillCountdown), 1000); }
function cohortProgress(co){
  const a = parseLocal(co.start).getTime(), b = parseLocal(co.end).getTime() + 864e5, n = Date.now();
  if(isNaN(a) || isNaN(b) || b <= a) return null;
  return Math.max(0, Math.min(100, Math.round((n - a) * 100 / (b - a))));
}

/* --- ציוד למיטה --- */
const EQUIP_DOC = 'equipment';
const EQUIP_SUGGEST = ['מזרן','כרית','שמיכה','סדין','ציפית','ארון','מנעול'];
const equipItems = () => (((S.rooms[EQUIP_DOC] || {}).items) || []).filter(x => x && x.name);
const bedCount = r => Math.max(0, Math.min(40, +r.cap || 0));
const perBed = it => Math.max(1, +it.qty || 1);
// ברירת מחדל: כל הציוד שברשימה קיים בכל מיטה, אלא אם סומן אחרת
function bedHas(eq, b, it){ const o = eq && eq[b] && eq[b][it.id]; return o == null ? perBed(it) : Math.max(0, +o || 0); }
// מיטה שהוסר ממנה כל הציוד נחשבת מיטה ריקה — לא נדרש בה ציוד ולא נחשב חוסר
const bedEmpty = (eq, b, items) => items.length > 0 && items.every(it => bedHas(eq, b, it) === 0);
function activeBeds(r, items, eq){ eq = eq || r.eq || {}; let k = 0; for(let b = 1; b <= bedCount(r); b++) if(!bedEmpty(eq, b, items)) k++; return k; }
function roomEquip(r, items, eq){
  eq = eq || r.eq || {};
  const n = bedCount(r), on = [];
  for(let b = 1; b <= n; b++) if(!bedEmpty(eq, b, items)) on.push(b);
  return items.map(it => { let act = 0; on.forEach(b => { act += bedHas(eq, b, it); }); return { it, req: on.length * perBed(it), act, beds: on.length }; });
}
const roomMissing = (r, items) => roomEquip(r, items).some(x => x.act < x.req);
function saveEquipList(items, okMsg){ return act(S.db.doc('rooms/'+EQUIP_DOC).set({ items, updatedAt:Date.now(), updatedBy:S.me.id }), okMsg); }

  };
  const clearBed = b => { eq[b] = {}; items.forEach(it => { eq[b][it.id] = 0; }); draw(); saveRooms(cid, x => { const t = x.rooms[id]; if(!t) return false; t.eq = clone(eq); }, `כל הציוד הוסר ממיטה ${b}`); };

    wrap.replaceChildren(

          return h('tr',{class: emp ? 'bed-empty' : ''}, h('td',{class:'bed'}, 'מיטה ' + b, emp ? h('span',{class:'xs muted'}, ' · ריקה') : null),

        h('tfoot',null,
          h('tr',null, h('td',{class:'bed'}, 'צריך'), sums.map(x => h('td',null, x.req, h('span',{class:'xs muted'}, ` (${x.beds}×${perBed(x.it)})`))), editable ? h('td',null) : null),

/* =====================================================================
   רס״פיות — מלאי ציוד פלוגתי (שולב מאתר המלאי של הגדוד)
   נתונים: invStock (שורה לכל פלוגה×ציוד), invReq (בקשות העברה),
           invMeta/cats (קטגוריות ושיוך פריטים), invLog (יומן פעולות)
   ===================================================================== */
const INV_DEFAULT_CATS = ['ציוד מטווח','מיכלי מים','ציוד מהאל','כלי עבודה','שולחנות וכיסאות','ארגזי סמל ותכולתם'];
const INV_NOCAT = 'לא משויך';
const INV_REQ_ST = { pending:'ממתין', approved:'אושר', rejected:'נדחה', cancelled:'בוטל' };
// נרמול שם ציוד: רווחים, גרשיים ומירכאות — כמו באתר המקורי
const invKey = s => String(s || '').trim().replace(/\s+/g, ' ').replace(/['’`]/g, '׳').replace(/"/g, '״');
const invSoft = s => invKey(s).replace(/[\s׳״'"`\-.]/g,'').replace(/[וי]/g,'').replace(/ם/g,'מ').replace(/ן/g,'נ').replace(/ץ/g,'צ').replace(/ף/g,'פ').replace(/ך/g,'כ');
function invLev1(a, b){
  if(a === b) return true; if(Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, d = 0;
  while(i < a.length && j < b.length){ if(a[i] === b[j]){ i++; j++; continue; } if(++d > 1) return false; if(a.length > b.length) i++; else if(b.length > a.length) j++; else { i++; j++; } }
  return d + (a.length - i) + (b.length - j) <= 1;
}
const invSimilar = (a, b) => { if(invKey(a) === invKey(b)) return false; const x = invSoft(a), y = invSoft(b); return x === y || (Math.min(x.length, y.length) >= 4 && invLev1(x, y)); };
const invCoKey = c => String(c || '').replace(/[׳'״"\s]/g, '');
const invHash = s => { let h1 = 5381, h2 = 52711; for(let i = 0; i < s.length; i++){ const c = s.charCodeAt(i); h1 = (h1 * 33) ^ c; h2 = (h2 * 33) ^ c; } return (h1 >>> 0).toString(36) + (h2 >>> 0).toString(36); };
const invDocId = (co, item) => 's_' + invHash(invCoKey(co) + '|' + invKey(item));
const invCats = () => { const l = (S.invMeta && S.invMeta.list) || INV_DEFAULT_CATS; return l.slice(); };
const invCatOf = item => ((S.invMeta && S.invMeta.map) || {})[invKey(item)] || INV_NOCAT;
const invStock = () => (S.invStock || []).filter(r => r.item);
const invComps = () => { const l = companies(); const extra = [...new Set(invStock().map(r => r.company).filter(c => c && !l.includes(c)))].sort((a, b) => a.localeCompare(b, 'he')); return l.concat(extra); };
const invRow = (co, item) => invStock().find(r => r.company === co && invKey(r.item) === invKey(item));
const invAllNames = () => [...new Set(invStock().map(r => r.item))].sort((a, b) => a.localeCompare(b, 'he'));
function invCanEdit(co){
  const me = S.me.id, m = meM() || {}, lvl = netLevel(me, 'logistics');
  if(isAdmin() || isLead(me, 'logistics') || lvl === 'bn') return true;
  return lvl === 'co' && !!co && invCoKey(m.company) === invCoKey(co);
}
const invEditableComps = () => invComps().filter(invCanEdit);
function invLog(action, company, item, details){
  const id = 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  return S.db.doc('invLog/' + id).set({ at: Date.now(), action, company: company || '', item: item || '', details: details || '', by: S.me.id }).catch(e => console.warn('invLog', e));
}
async function invSaveRow(co, item, ok, bad){
  const existing = invStock().find(r => invKey(r.item) === invKey(item));
  const name = existing ? existing.item : invKey(item);       // שם קיים גובר, כדי שלא ייווצרו כפילויות
  await S.db.doc('invStock/' + invDocId(co, name)).set({ company: co, item: name, ok: Math.max(0, Math.round(+ok || 0)), bad: Math.max(0, Math.round(+bad || 0)), updatedAt: Date.now(), by: S.me.id });
  return name;
}
async function invSetCat(item, cat){
  const map = Object.assign({}, (S.invMeta && S.invMeta.map) || {});
  if(map[invKey(item)] === cat) return;
  map[invKey(item)] = cat;
  await S.db.doc('invMeta/cats').set(Object.assign({}, S.invMeta || {}, { list: invCats(), map }));
}
